<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Najdi smažák</title>
  <meta name="theme-color" content="#0a192f" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-900 min-h-screen p-4 pt-[calc(var(--safe-area-top)+1rem)] pb-[calc(var(--safe-area-bottom)+1rem)]">
  <div class="max-w-md mx-auto flex flex-col space-y-6 pt-14">
    <h1 class="font-orbitron text-3xl text-center text-cyan-300">Najdi smažák</h1>
    <header class="hud-bar fixed top-[calc(var(--safe-area-top)+0.4rem)] left-1/2 -translate-x-1/2 w-[min(94vw,28rem)] flex justify-between items-center px-2 z-30">
      <div id="threat-level-pill" class="threat-pill threat-low text-black font-bold text-xs md:text-sm py-1.5 px-4 rounded-full font-orbitron text-center">Na pohodu, jen trošku sjetý</div>
    </header>
    <div class="relative w-full aspect-square flex items-center justify-center my-4">
      <div id="scanner-visual" class="absolute w-full h-full rounded-full">
        <div id="scanner-container" class="absolute w-full h-full">
          <div class="radar-sweep"></div>
          <div class="scanner-pulse w-full h-full"></div><div class="scanner-pulse w-full h-full"></div><div class="scanner-pulse w-full h-full"></div>
        </div>
      </div>
      <div class="font-orbitron text-center z-10">
        <div id="scanner-status" class="text-3xl font-bold text-cyan-300 transition-all" style="text-shadow: 0 0 15px var(--glow-blue);">HOTOVEJ NA ŠLEH</div>
        <div id="scanner-subtext" class="text-sm text-slate-400 transition-all">Čekám na lajnu</div>
      </div>
    </div>

    <div class="flex gap-2"><button id="scan-button" class="btn btn-scan flex-1 p-4 rounded-full text-xl font-orbitron font-bold text-black tracking-wider">Najdi nejbližšího smážu</button><button id="sound-toggle" class="btn px-4 rounded-full glass-panel text-xs">🔊</button></div>

    <div class="glass-panel p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-orbitron text-lg">ROZBOR MATROŠE</h3>
        <button id="profile-button" class="btn btn-profile px-3 py-1 rounded-full text-xs font-orbitron font-bold text-black">Kdo je ten smažka?</button>
      </div>
      <div class="flex items-center space-x-4 mb-4">
        <div class="w-20 h-20 rounded-full border-2 border-cyan-400 shadow-lg flex-shrink-0" style="box-shadow: 0 0 15px var(--glow-blue);">
          <svg id="subject-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><radialGradient id="avbg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(30 20) rotate(40) scale(95)"><stop stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#1e293b" stop-opacity="0.2"/></radialGradient></defs>
            <circle cx="50" cy="50" r="49" fill="url(#avbg)" stroke="var(--accent-blue)" stroke-width="2"/>
            <path d="M20 72c12-7 19-11 30-11s18 4 30 11" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M32 44c0-10 8-18 18-18s18 8 18 18-8 18-18 18-18-8-18-18Z" stroke="#22d3ee" stroke-width="2.5"/>
            <text id="subject-avatar-text" x="50" y="86" font-family="Orbitron, sans-serif" font-size="10" fill="var(--accent-blue)" text-anchor="middle">ŠLEHAŘ</text>
          </svg>
        </div>
        <div class="flex-1">
          <div id="subject-name" class="font-bold text-xl">Šlehař Delta-Piko</div>
          <div class="text-sm text-slate-400">Stav: Relativně v klidu</div>
          <div id="target-threat-pill" class="mt-2 threat-pill threat-low text-black text-xs font-bold py-1 px-3 rounded-full inline-block text-center">Na pohodu, jen trošku sjetý</div>
        </div>
      </div>
      <div class="space-y-2">
        <div class="grid grid-cols-2 gap-2 text-center text-xs">
          <div class="glass-panel p-2 rounded-lg"><div id="stat-bpm" class="font-bold text-base text-yellow-400">82</div><div>TEPÍK</div></div>
          <div class="glass-panel p-2 rounded-lg"><div id="stat-risk" class="font-bold text-base text-yellow-400">18%</div><div>ŠANCE ŽE RUPNE ŽÍLA</div></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
          <div class="glass-panel p-2 rounded-lg"><div id="stat-scans" class="font-bold text-base text-cyan-300">0</div><div>SCANŮ CELKEM</div></div>
          <div class="glass-panel p-2 rounded-lg"><div id="stat-today" class="font-bold text-base text-cyan-300">0</div><div>DNES ULOVENO</div></div>
        </div>
        <div class="text-xs text-slate-400 mt-2">Poslední výskyt: <span id="last-seen">nikdy</span> • Vzdálenost: <span id="distance-indicator">-- m</span></div>
        <div class="flex gap-2"><button id="ai-analysis-button" class="btn btn-ai flex-1 p-3 mt-2 rounded-full text-md font-orbitron font-bold text-black tracking-wider hidden">✨ Poradna od dealerů</button><button id="share-button" class="btn glass-panel px-4 mt-2 rounded-full text-xs">Sdílet</button></div>
      </div>
    </div>

    <div class="glass-panel p-5"><h3 class="font-orbitron text-lg mb-4">ZÁPISKY ZE DNA</h3><ul id="activity-log" class="space-y-2 text-sm h-44 overflow-y-auto pr-2"></ul></div>
  </div>

  <div id="ai-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden opacity-0">
    <div class="glass-panel w-full max-w-lg p-6 relative border border-cyan-400/20 shadow-2xl shadow-cyan-900/40">
      <button id="modal-close-button" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
      <h3 id="modal-title" class="font-orbitron text-xl mb-4 text-cyan-300"></h3>
      <div id="modal-content" class="text-slate-300 leading-relaxed max-h-[60vh] overflow-y-auto"></div>
      <div id="modal-loader" class="w-full flex justify-center items-center py-8 hidden"><div class="ai-modal-loader"></div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
